<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Form input serah-terima dokumen logistik yang ringkas dan mudah dibaca.">
  <title>Form Handover Dokumen Logistik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f7fafc;--ink:#102a43;--green:#16a085;--line:#dce7ef;--muted:#637b8f;--danger:#c43d3d;--white:#fff;--shadow:0 10px 32px rgba(16,42,67,.06)}
    *{box-sizing:border-box}html{font-family:Manrope,sans-serif}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit;letter-spacing:0}.page{width:100%;max-width:672px;margin:auto;padding:32px 16px 48px}.brand{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:700;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}h1,h2{font-family:Sora,sans-serif}h1{margin:16px 0 0;font-size:32px;line-height:1.2}header p{margin:6px 0 0;color:var(--muted);font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.action{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}.action:hover,.action:focus{border-color:var(--green);color:var(--green);outline:none}.section{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:var(--shadow)}.section-head{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:12px;margin-bottom:20px}.number{font-family:monospace;color:var(--green);font-size:12px}.section h2{margin:0;font-size:16px}.rule{height:1px;background:var(--line)}.fields{display:grid;gap:20px}.field-wrap{display:block;min-width:0}.label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700}.field{display:block;width:100%;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--white);color:var(--ink);font-size:15px;line-height:1.5;outline:none;transition:.18s}.field:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(22,160,133,.14)}.field[readonly]{background:#edf4f7;font-weight:700}.field::placeholder{color:#98aaba}textarea.field{min-height:96px;resize:vertical}.status{display:flex;align-items:center;gap:10px;min-width:0}.status-text{margin:0;font-size:14px;font-weight:700;overflow-wrap:anywhere}.submit{width:100%;margin-top:16px;padding:14px 20px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}.submit:hover{background:var(--green)}.submit:disabled{opacity:.6;cursor:not-allowed}.error .dot{background:var(--danger)}.error .status-text{color:var(--danger)}
    @media(min-width:640px){.page{padding:56px 20px}.actions{display:flex;flex-wrap:wrap}.action{padding:8px 14px}}
    @media print{.actions,.submit{display:none}.page{max-width:none;padding:0}.section{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><span class="dot"></span>Sistem Logistik</div>
      <h1>Form Handover</h1>
      <p>Serah-terima dokumen logistik</p>
      <div class="actions">
        <button class="action" type="button" id="print">Cetak Surat</button>
        <button class="action" type="button" id="editRow">Edit Urutan</button>
        <button class="action" type="button" id="editLetter">Ganti No Surat</button>
        <button class="action" type="button" id="reset">Reset</button>
      </div>
    </header>

    <form id="handoverForm">
      <section class="section">
        <div class="section-head"><span class="number">01</span><h2>Identitas</h2><span class="rule"></span></div>
        <div class="fields">
          <label class="field-wrap"><span class="label">Nomor Surat Jalan</span><input class="field" id="noSuratJalan" readonly></label>
          <label class="field-wrap"><span class="label">PIC</span><input class="field" id="picInput" name="picInput" placeholder="Nama PIC" required></label>
          <label class="field-wrap"><span class="label">Nomor Urut</span><input class="field" id="nomorUrut" readonly></label>
        </div>
      </section>

      <section class="section">
        <div class="section-head"><span class="number">02</span><h2>Detail Dokumen</h2><span class="rule"></span></div>
        <div class="fields">
          <label class="field-wrap"><span class="label">Working Order</span><input class="field upper" id="workingOrder" list="list-workingOrder" required></label>
          <label class="field-wrap"><span class="label">Vendor</span><input class="field upper" id="vendor" list="list-vendor" required></label>
          <label class="field-wrap"><span class="label">Keterangan / Detail</span><textarea class="field upper" id="keterangan" list="list-keterangan" required></textarea></label>
          <label class="field-wrap"><span class="label">Tax Number</span><input class="field upper" id="nomorPajak" list="list-nomorPajak"></label>
          <label class="field-wrap"><span class="label">Nominal Termin</span><input class="field money" id="nominalTermin" type="text" inputmode="numeric" placeholder="Rp 0"></label>
          <label class="field-wrap"><span class="label">Nominal PPN</span><input class="field money" id="nominalPPN" type="text" inputmode="numeric" placeholder="Rp 0"></label>
          <label class="field-wrap"><span class="label">Invoice Number</span><input class="field upper" id="invNumber" list="list-invNumber" required></label>
          <label class="field-wrap"><span class="label">Tanggal Invoice</span><input class="field" id="tanggalInvoice" type="date" required></label>
          <label class="field-wrap"><span class="label">Amount</span><input class="field money" id="amount" type="text" inputmode="numeric" placeholder="Rp 0" required></label>
        </div>
        <datalist id="list-workingOrder"></datalist><datalist id="list-vendor"></datalist><datalist id="list-keterangan"></datalist><datalist id="list-nomorPajak"></datalist><datalist id="list-invNumber"></datalist>
      </section>

      <section class="section" id="statusBox">
        <div class="status"><span class="dot"></span><p class="status-text" id="message" aria-live="polite">Siap diverifikasi</p></div>
        <button class="submit" id="submit" type="submit">Simpan &amp; Update</button>
      </section>
    </form>
  </main>
  <script>
    const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzGoUdAdr2nmt36mUvClPXncOzy56iPzv_bAsCidkqlDJrVRaCqbeygvWwurpJp5_Mz/exec';
    const keys=['workingOrder','vendor','keterangan','nomorPajak','invNumber'];
    let suratCounter=parseInt(localStorage.getItem('suratCounter')||'1',10)||1;
    let globalRowCounter=parseInt(localStorage.getItem('globalRowCounter')||'1',10)||1;
    let suggestions={workingOrder:[],vendor:[],keterangan:[],nomorPajak:[],invNumber:[]};
    try{suggestions={...suggestions,...JSON.parse(localStorage.getItem('inputSuggestions')||'{}')}}catch(e){}
    const el=id=>document.getElementById(id);
    const noSurat=()=>`${String(suratCounter).padStart(3,'0')}-HSM/LOG/WO/${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][new Date().getMonth()]}/${new Date().getFullYear()}`;
    function render(){el('noSuratJalan').value=noSurat();el('nomorUrut').value=globalRowCounter;el('submit').textContent=`Simpan & Update (No. ${globalRowCounter})`;keys.forEach(k=>{el('list-'+k).innerHTML=(suggestions[k]||[]).map(v=>`<option value="${String(v).replaceAll('"','&quot;')}"></option>`).join('')})}
    function setMessage(text,error=false){el('message').textContent=text;el('statusBox').classList.toggle('error',error)}
    function resetForm(){keys.concat(['nominalTermin','nominalPPN','tanggalInvoice','amount']).forEach(id=>el(id).value='');if(typeof clearMoney==='function')clearMoney();setMessage('Siap diverifikasi');el('workingOrder').focus()}
    document.querySelectorAll('.upper').forEach(input=>input.addEventListener('input',()=>{input.value=input.value.toUpperCase()}));
    el('picInput').value=localStorage.getItem('lastPic')||'';el('picInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase()});
    el('print').onclick=()=>{window.location.href='print.html?noSuratJalan='+encodeURIComponent(noSurat());};el('reset').onclick=resetForm;
    el('editRow').onclick=()=>{const v=parseInt(prompt('Masukkan Nomor Urut Baru:',globalRowCounter)||'',10);if(v>0){globalRowCounter=v;localStorage.setItem('globalRowCounter',v);render()}};
    el('editLetter').onclick=()=>{const v=parseInt(prompt('Masukkan Nomor Surat Jalan Baru:',suratCounter)||'',10);if(v>0){suratCounter=v;localStorage.setItem('suratCounter',v);render()}};
    el('handoverForm').addEventListener('submit',async event=>{event.preventDefault();const button=el('submit');button.disabled=true;button.textContent='Memproses...';setMessage('Sedang mengirim data...');try{const payload={nomorUrut:globalRowCounter,picInput:el('picInput').value.toUpperCase(),timestamp:new Date().toLocaleString('id-ID'),noSuratJalan:noSurat()};keys.concat(['tanggalInvoice']).forEach(k=>payload[k]=el(k).value);['nominalTermin','nominalPPN','amount'].forEach(k=>payload[k]=digitsOnly(el(k).value));await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});keys.forEach(k=>{if(payload[k]&&!suggestions[k].includes(payload[k]))suggestions[k]=[payload[k],...suggestions[k]].slice(0,25)});localStorage.setItem('inputSuggestions',JSON.stringify(suggestions));localStorage.setItem('lastPic',payload.picInput);globalRowCounter++;localStorage.setItem('globalRowCounter',globalRowCounter);resetForm();setMessage('Data berhasil disimpan.');render()}catch(error){setMessage('Data gagal dikirim. Silakan coba lagi.',true)}finally{button.disabled=false;render()}});

    const digitsOnly=v=>String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'');
    const formatRupiah=raw=>raw?'Rp '+Number(raw).toLocaleString('id-ID'):'';
    const rawMoney={};
    document.querySelectorAll('.money').forEach(input=>{rawMoney[input.id]='';input.addEventListener('input',()=>{const raw=digitsOnly(input.value);rawMoney[input.id]=raw;input.value=formatRupiah(raw)})});
    const clearMoney=()=>document.querySelectorAll('.money').forEach(i=>{rawMoney[i.id]='';i.value=''});
    render();
  </script>
</body>
</html>
