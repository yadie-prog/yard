<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Document Handover</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            body { 
                background: white !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
            .print-area { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 1cm !important;
                display: block !important;
                visibility: visible !important;
            }
            table { width: 100% !important; border-collapse: collapse !important; }
            table td, table th { 
                padding: 6px !important; 
                font-size: 9px !important; 
                border: 1px solid #e2e8f0 !important; 
            }
            tr { page-break-inside: avoid; }
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .signature-img {
            height: 60px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGoUdAdr2nmt36mUvClPXncOzy56iPzv_bAsCidkqlDJrVRaCqbeygvWwurpJp5_Mz/exec";

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (typeof lucide !== 'undefined' && iconRef.current) {
                    lucide.createIcons();
                }
            }, [name, className]);
            return <i ref={iconRef} data-lucide={name} className={className}></i>;
        };

        function App() {
            const [searchNo, setSearchNo] = useState(() => {
                try { return new URLSearchParams(window.location.search).get('noSuratJalan') || ''; } catch (e) { return ''; }
            });
            const [loading, setLoading] = useState(false);
            const [items, setItems] = useState([]);
            const [error, setError] = useState('');
            const [printDate, setPrintDate] = useState('');

            useEffect(() => {
                const now = new Date();
                const options = { day: '2-digit', month: 'long', year: 'numeric' };
                setPrintDate(now.toLocaleDateString('id-ID', options));
                const preset = (() => { try { return new URLSearchParams(window.location.search).get('noSuratJalan') || ''; } catch (err) { return ''; } })();
                if (preset) handleSearch(null, preset);
            }, []);

            const handleSearch = async (e, overrideNo) => {
                if (e) e.preventDefault();
                const targetNo = overrideNo || searchNo;
                if (!targetNo) return;
                
                setLoading(true);
                setError('');
                setItems([]);

                try {
                    const response = await fetch(`${SCRIPT_URL}?action=read&noSuratJalan=${encodeURIComponent(targetNo)}`);
                    const result = await response.json();

                    if (result.status === "success" && result.data) {
                        const processedData = Array.isArray(result.data) ? result.data : [result.data];
                        if (processedData.length > 0) {
                            setItems(processedData);
                        } else {
                            setError('Data tidak ditemukan.');
                        }
                    } else {
                        setError(result.message || 'Gagal memuat data.');
                    }
                } catch (err) {
                    setError('Gagal memuat data. Periksa koneksi atau CORS.');
                } finally {
                    setLoading(false);
                }
            };

            const formatCurrency = (val) => {
                const number = parseFloat(String(val).replace(/[^0-9.-]+/g,"")) || 0;
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
            };
            
            const formatDateOnly = (dateStr) => {
                if (!dateStr) return '-';
                try {
                    const date = new Date(dateStr);
                    if (isNaN(date.getTime())) return dateStr;

                    return date.toLocaleDateString('id-ID', {
                        day: '2-digit',
                        month: 'long',
                        year: 'numeric'
                    });
                } catch (err) {
                    return dateStr;
                }
            };

            const metadata = items[0] || {};
            const sumOf = (key) => items.reduce((acc, it) => acc + (parseFloat(String(it[key] ?? '').replace(/[^0-9.-]+/g, "")) || 0), 0);
            const totalTermin = sumOf('nominalTermin');
            const totalPPN = sumOf('nominalPPN');
            const totalAmount = sumOf('amount');

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="no-print bg-white p-6 rounded-3xl shadow-xl border border-slate-100 mb-8 animate-fade-in relative overflow-hidden">
                        <a href="input.html" className="absolute top-6 right-6 flex items-center gap-2 text-[10px] font-black uppercase text-slate-400 hover:text-indigo-600 transition-colors">
                            <Icon name="arrow-left" className="w-3 h-3" /> Kembali 
                        </a>

                        <div className="flex items-center gap-3 mb-6">
                            <div className="p-3 bg-indigo-600 rounded-2xl text-white">
                                <Icon name="printer" />
                            </div>
                            <div>
                                <h2 className="text-xl font-extrabold text-slate-800">Cetak Dokumen</h2>
                                <p className="text-sm text-slate-400 font-medium">Masukkan Nomor Surat Jalan</p>
                            </div>
                        </div>

                        <form onSubmit={handleSearch} className="flex gap-3">
                            <div className="flex-1 relative">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300">
                                    <Icon name="search" />
                                </div>
                                <input 
                                    type="text"
                                    placeholder="Contoh: 001-HSM/..."
                                    className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-indigo-500/10 focus:bg-white transition-all font-bold"
                                    value={searchNo}
                                    onChange={(e) => setSearchNo(e.target.value.toUpperCase())}
                                />
                            </div>
                            <button 
                                type="submit" 
                                disabled={loading}
                                className="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold hover:bg-indigo-600 transition-all disabled:opacity-50 min-w-[140px]"
                            >
                                {loading ? "Memuat..." : "Cari Data"}
                            </button>
                        </form>
                        {error && <div className="mt-4 p-4 bg-red-50 text-red-600 rounded-xl text-sm font-bold border border-red-100">{error}</div>}
                    </div>

                    {items.length > 0 ? (
                        <div className="print-area bg-white p-8 shadow-2xl border border-slate-100 min-h-[1050px] relative animate-fade-in flex flex-col">
                            
                            <div className="flex justify-between items-start border-b-2 border-slate-900 pb-4 mb-6">
                                <div>
                                    <h1 className="text-3xl font-black text-slate-900 uppercase tracking-tighter">Document Handover</h1>
                                    <p className="text-slate-400 font-bold tracking-widest text-[9px] uppercase">Logistics Delivery</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs font-bold text-slate-500">No. Surat Jalan: <span className="text-slate-900 font-black">{metadata.noSuratJalan || searchNo}</span></p>
                                    <p className="text-xs font-bold text-slate-500">Tanggal Cetak: <span className="text-slate-900 font-bold">{printDate}</span></p>
                                </div>
                            </div>


                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div></div>
                                <div className="bg-slate-50 px-4 py-3 rounded-xl border border-slate-100 flex items-center justify-around text-center">
                                    <div>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase">Total Item</p>
                                        <p className="text-lg font-black text-slate-900">{items.length}</p>
                                    </div>
                                    <div className="border-l border-slate-200 pl-4">
                                        <p className="text-[9px] font-bold text-slate-400 uppercase">Total Amount</p>
                                        <p className="text-sm font-black text-slate-900 uppercase">{formatCurrency(totalAmount)}</p>
                                    </div>
                                </div>
                            </div>


                            <div className="flex-1 overflow-x-auto">
                                <table className="w-full border border-slate-200">
                                    <thead>
                                        <tr className="bg-slate-900 text-white">
                                            <th className="py-2 px-1 text-center text-[9px] font-black uppercase w-8">No</th>
                                            <th className="py-2 px-3 text-left text-[9px] font-black uppercase">Working Order</th>
                                            <th className="py-2 px-3 text-left text-[9px] font-black uppercase">Vendor</th>
                                            <th className="py-2 px-3 text-left text-[9px] font-black uppercase">No. Invoice & Pajak</th>
                                            <th className="py-2 px-3 text-left text-[9px] font-black uppercase">Tgl Invoice</th>
                                            <th className="py-2 px-3 text-left text-[9px] font-black uppercase">Keterangan</th>
                                            <th className="py-2 px-3 text-right text-[9px] font-black uppercase">Termin</th>
                                            <th className="py-2 px-3 text-right text-[9px] font-black uppercase">PPN</th>
                                            <th className="py-2 px-3 text-right text-[9px] font-black uppercase">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {items.map((item, index) => (
                                            <tr key={index}>
                                                <td className="py-2 px-1 text-center text-xs text-slate-400 border border-slate-100">{index + 1}</td>
                                                <td className="py-2 px-3 text-xs font-black border border-slate-100">{item.workingOrder}</td>
                                                <td className="py-2 px-3 text-xs border border-slate-100">{item.vendor || '-'}</td>
                                                <td className="py-2 px-3 text-xs border border-slate-100">
                                                    <div className="font-bold">{item.invNumber}</div>
                                                    <div className="text-[10px] text-slate-400">Pajak: {item.nomorPajak || '-'}</div>
                                                </td>
                                                <td className="py-2 px-3 text-xs border border-slate-100">{formatDateOnly(item.tanggalInvoice)}</td>
                                                <td className="py-2 px-3 text-xs border border-slate-100">{item.keterangan || '-'}</td>
                                                <td className="py-2 px-3 text-right text-xs border border-slate-100">{formatCurrency(item.nominalTermin)}</td>
                                                <td className="py-2 px-3 text-right text-xs border border-slate-100">{formatCurrency(item.nominalPPN)}</td>
                                                <td className="py-2 px-3 text-right text-xs font-black border border-slate-100">{formatCurrency(item.amount)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                    <tfoot>
                                        <tr className="bg-slate-100">
                                            <td className="py-2 px-3 text-right text-[9px] font-black uppercase border border-slate-100" colSpan={6}>Total</td>
                                            <td className="py-2 px-3 text-right text-xs font-black border border-slate-100">{formatCurrency(totalTermin)}</td>
                                            <td className="py-2 px-3 text-right text-xs font-black border border-slate-100">{formatCurrency(totalPPN)}</td>
                                            <td className="py-2 px-3 text-right text-xs font-black border border-slate-100">{formatCurrency(totalAmount)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>

                            <div className="grid grid-cols-3 gap-8 mt-12 pt-8 border-t border-slate-100">
                                <div className="text-center flex flex-col items-center">
                                    <p className="text-[9px] font-black text-slate-400 uppercase mb-2">Dibuat Oleh</p>
                                    <div className="h-16 flex items-center justify-center">
                                        <div className="h-16"></div>
                                    </div>
                                    <p className="text-xs font-black border-b border-slate-900 pb-1 uppercase w-full">&nbsp;</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-[9px] font-black text-slate-400 uppercase mb-16">Logistik</p>
                                    <div className="border-b border-slate-200 h-5"></div>
                                </div>
                                <div className="text-center">
                                    <p className="text-[9px] font-black text-slate-400 uppercase mb-16">Penerima</p>
                                    <div className="border-b border-slate-200 h-5"></div>
                                </div>
                            </div>

                            <div className="mt-8 pt-4 flex justify-between text-[8px] font-bold text-slate-300 uppercase tracking-widest">
                                <span>Dicetak pada: {new Date().toLocaleString('id-ID')}</span>
                                <span>Digital Logistic System</span>
                            </div>

                            <button 
                                onClick={() => window.print()}
                                className="no-print fixed bottom-10 right-10 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all flex items-center justify-center z-50"
                            >
                                <Icon name="printer" className="w-6 h-6" />
                            </button>
                        </div>
                    ) : (
                        !loading && (
                            <div className="bg-white p-24 rounded-[3rem] text-center border-4 border-dashed border-slate-100">
                                <Icon name="search" className="w-12 h-12 text-slate-200 mx-auto mb-4" />
                                <h3 className="text-xl font-black text-slate-300 uppercase">Cetak</h3>
                                <p className="text-slate-300 font-bold text-sm">Masukkan nomor surat jalan di atas untuk menampilkan data</p>
                            </div>
                        )
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
