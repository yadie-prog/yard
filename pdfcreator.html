<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Studio Pro — Gabung Gambar & PDF jadi A4 Terkompres</title>
<meta name="description" content="Gabungkan JPG, PNG, dan PDF menjadi satu file A4 rapi. Gambar otomatis dikompres ke ukuran KB tanpa mengorbankan kualitas." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --bg1:#eef2ff; --bg2:#f8fafc; --card:#ffffff; --edge:#e2e8f0; --border:#cbd5e1;
    --fg:#0f172a; --muted:#64748b; --primary:#4338ca; --primary-soft:#eef2ff;
    --primary-fg:#ffffff; --danger:#dc2626; --danger-fg:#fff; --muted-bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--fg);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;padding:40px 20px}
  .wrap{width:100%;max-width:672px}
  .card{background:rgba(255,255,255,.95);border:1px solid var(--edge);border-radius:32px;padding:40px 32px;
    box-shadow:0 24px 60px -20px rgba(15,23,42,.25);backdrop-filter:blur(6px)}
  header{text-align:center}
  .badge{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
  h1{margin:12px 0 0;font-size:30px;letter-spacing:-.02em;color:var(--primary)}
  .sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
  .drop{margin-top:28px;width:100%;background:var(--card);border:2px dashed var(--border);border-radius:24px;
    padding:40px 20px;text-align:center;cursor:pointer;font:inherit;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
  .drop b{display:block;font-weight:500}
  .drop small{display:block;margin-top:4px;color:var(--muted)}
  #grid{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px;
    max-height:350px;overflow-y:auto;background:rgba(241,245,249,.6);border-radius:16px;padding:16px}
  #grid:empty{display:none}
  .thumb{position:relative}
  .thumb .box{aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;
    border:4px solid var(--card);background:var(--card);box-shadow:0 4px 12px rgba(15,23,42,.08);cursor:grab;font-size:11px;text-align:center;color:var(--muted)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .rm{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border:0;border-radius:999px;
    background:var(--danger);color:var(--danger-fg);font-weight:700;cursor:pointer;line-height:1}
  .thumb p{margin:4px 0 0;text-align:center;font-size:10.5px;color:var(--muted)}
  .fields{margin-top:24px;display:flex;flex-direction:column;gap:20px}
  input[type=text],select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);font:inherit;font-size:14px;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--primary)}
  .row{display:grid;gap:16px}
  @media(min-width:640px){.row{grid-template-columns:1fr 1fr}}
  label{display:block;margin-bottom:8px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
  #go{margin-top:24px;width:100%;padding:16px;border:0;border-radius:16px;background:var(--primary);color:var(--primary-fg);
    font:inherit;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 12px 30px -10px rgba(67,56,202,.7)}
  #go:active{transform:scale(.98)}
  #go:disabled{background:var(--muted-bg);color:var(--muted);box-shadow:none;cursor:not-allowed}
  .msg{margin-top:16px;padding:12px 16px;border-radius:12px;text-align:center;font-size:14px}
  .ok{background:var(--primary-soft);color:var(--primary)}
  .err{background:#fee2e2;color:var(--danger)}
  footer{margin-top:40px;text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <span class="badge">V3.1 — Extreme Image Compression</span>
      <h1>PDF Studio Pro</h1>
      <p class="sub">Urutkan, gabungkan &amp; buat PDF A4 dengan gambar terkompres otomatis.</p>
    </header>

    <button type="button" class="drop" id="drop">
      <b>Klik / seret file ke sini</b>
      <small>Mendukung JPG, PNG, PDF</small>
    </button>
    <input type="file" id="picker" accept="image/*,application/pdf" multiple hidden />

    <div id="grid"></div>

    <div class="fields">
      <input type="text" id="fname" placeholder="Nama File Output (Opsional)" />
      <div class="row">
        <div>
          <label for="layout">Layout Halaman</label>
          <select id="layout">
            <option value="1">1 Gambar / Hal</option>
            <option value="2">2 Gambar / Hal</option>
            <option value="4">4 Gambar / Hal (2x2)</option>
            <option value="6">6 Gambar / Hal (2x3)</option>
            <option value="8">8 Gambar / Hal (2x4)</option>
          </select>
        </div>
        <div>
          <label for="level">Kompresi Gambar</label>
          <select id="level">
            <option value="high">Kualitas Tinggi (~180 KB/gbr)</option>
            <option value="balanced" selected>Seimbang (~100 KB/gbr)</option>
            <option value="small">Ukuran Sangat Kecil (~50 KB/gbr)</option>
          </select>
        </div>
      </div>
    </div>

    <button type="button" id="go" disabled>Proses &amp; Download</button>
    <p class="msg ok" id="ok" hidden></p>
    <p class="msg err" id="err" hidden></p>
  </div>
  <footer>© 2026 DAC Project</footer>
</div>

<script>
const { PDFDocument, PageSizes } = PDFLib;

// Dimensi maksimum (maxEdge) disesuaikan agar tidak membuang resolusi berlebih pada kertas A4
const PRESETS = {
  high:     { maxEdge: 1600, targetKB: 180, initialQuality: 0.75, minQuality: 0.50 },
  balanced: { maxEdge: 1200, targetKB: 100, initialQuality: 0.65, minQuality: 0.35 },
  small:    { maxEdge: 800,  targetKB: 50,  initialQuality: 0.50, minQuality: 0.20 },
};
const MARGIN = 28;
let items = [];

const $ = (id) => document.getElementById(id);
const grid = $("grid"), picker = $("picker"), drop = $("drop"), go = $("go");

function formatBytes(b){
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(0) + " KB";
  return (b/1048576).toFixed(2) + " MB";
}

function loadImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("Gambar tidak dapat dibaca"));
    img.src = src;
  });
}

function toBlob(canvas, q){
  return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("Gagal mengompres gambar")), "image/jpeg", q));
}

async function compressImage(src, level){
  const p = PRESETS[level];
  const img = await loadImage(src);

  // Menghitung rasio scaling berdasarkan batas panjang piksel maksimum
  let scale = Math.min(1, p.maxEdge / Math.max(img.width, img.height));
  let width = Math.max(1, Math.round(img.width * scale));
  let height = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = width; 
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("Canvas tidak didukung browser ini");

  // Rendisi latar belakang putih (mencegah bug PNG transparan menjadi hitam)
  ctx.imageSmoothingEnabled = true; 
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#ffffff"; 
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);

  const targetBytes = p.targetKB * 1024;
  let bestBlob = await toBlob(canvas, p.initialQuality);

  // Jika ukuran hasil kompresi awal masih melebihi batas target KB, lakukan penyesuaian biner/iteratif
  if (bestBlob.size > targetBytes) {
    let low = p.minQuality, high = p.initialQuality;
    for (let i = 0; i < 5; i++) {
      const mid = (low + high) / 2;
      const blob = await toBlob(canvas, mid);
      if (blob.size > targetBytes) {
        high = mid;
      } else {
        low = mid;
        bestBlob = blob;
      }
    }
    // Jika masih melebihi target, turunkan resolusi canvas sebesar 20% lalu kompresi ulang
    if (bestBlob.size > targetBytes) {
      canvas.width = Math.round(width * 0.8);
      canvas.height = Math.round(height * 0.8);
      const ctx2 = canvas.getContext("2d");
      ctx2.fillStyle = "#ffffff";
      ctx2.fillRect(0, 0, canvas.width, canvas.height);
      ctx2.drawImage(img, 0, 0, canvas.width, canvas.height);
      bestBlob = await toBlob(canvas, p.minQuality);
    }
  }

  const bytes = new Uint8Array(await bestBlob.arrayBuffer());
  return { bytes, bytesLength: bytes.byteLength };
}

function render(){
  grid.innerHTML = "";
  items.forEach(it => {
    const el = document.createElement("div");
    el.className = "thumb";
    el.dataset.id = it.id;
    const inner = it.type === "img"
      ? `<img src="${it.data}" alt="${it.name.replace(/"/g,"&quot;")}" />`
      : `PDF<br />${it.name.slice(0,12)}…`;
    el.innerHTML = `<div class="box">${inner}</div>
      <button class="rm" type="button" aria-label="Hapus">×</button>
      <p>${formatBytes(it.size)}</p>`;
    el.querySelector(".rm").onclick = () => { items = items.filter(x => x.id !== it.id); render(); };
    grid.appendChild(el);
  });
  go.disabled = items.length === 0;
}

new Sortable(grid, { animation: 150, onEnd(){
  const order = [...grid.children].map(c => c.dataset.id);
  items = order.map(id => items.find(i => i.id === id)).filter(Boolean);
}});

async function addFiles(list){
  if (!list || !list.length) return;
  for (const file of Array.from(list)) {
    const id = `${file.name}-${file.size}-${Math.random().toString(36).slice(2)}`;
    if (file.type.startsWith("image/")) {
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
      items.push({ id, type: "img", data, name: file.name, size: file.size });
    } else if (file.type === "application/pdf") {
      items.push({ id, type: "pdf", data: await file.arrayBuffer(), name: file.name, size: file.size });
    }
  }
  $("ok").hidden = true; $("err").hidden = true;
  picker.value = "";
  render();
}

drop.onclick = () => picker.click();
picker.onchange = e => addFiles(e.target.files);
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });

async function buildPdf(layout, level, onProgress){
  const doc = await PDFDocument.create();
  const [pageW, pageH] = PageSizes.A4;
  const cols = layout === 1 ? 1 : 2;
  const rows = Math.ceil(layout / cols);
  const cellW = (pageW - MARGIN * (cols + 1)) / cols;
  const cellH = (pageH - MARGIN * (rows + 1)) / rows;
  let originalImageBytes = 0, compressedImageBytes = 0, processed = 0, cursor = 0;

  while (cursor < items.length) {
    const item = items[cursor];
    if (item.type === "pdf") {
      const ext = await PDFDocument.load(item.data);
      const embedded = await doc.embedPdf(ext, ext.getPageIndices());
      for (const page of embedded) {
        const p = doc.addPage([pageW, pageH]);
        const s = Math.min(pageW / page.width, pageH / page.height);
        p.drawPage(page, { x:(pageW - page.width*s)/2, y:(pageH - page.height*s)/2, width:page.width*s, height:page.height*s });
      }
      cursor++; onProgress(++processed, items.length); continue;
    }
    const page = doc.addPage([pageW, pageH]);
    for (let slot = 0; slot < layout && cursor < items.length; slot++) {
      const current = items[cursor];
      if (current.type !== "img") break;
      const c = await compressImage(current.data, level);
      originalImageBytes += current.size; compressedImageBytes += c.bytesLength;
      const image = await doc.embedJpg(c.bytes);
      const col = slot % cols, row = Math.floor(slot / cols);
      const cellX = MARGIN + col * (cellW + MARGIN);
      const cellY = pageH - MARGIN - (row + 1) * cellH - row * MARGIN;
      const ratio = Math.min(cellW / image.width, cellH / image.height);
      const w = image.width * ratio, h = image.height * ratio;
      page.drawImage(image, { x: cellX + (cellW - w)/2, y: cellY + (cellH - h)/2, width: w, height: h });
      cursor++; onProgress(++processed, items.length);
    }
  }
  return { bytes: await doc.save(), originalImageBytes, compressedImageBytes };
}

go.onclick = async () => {
  go.disabled = true; $("ok").hidden = true; $("err").hidden = true;
  try {
    const layout = Number($("layout").value), level = $("level").value;
    const r = await buildPdf(layout, level, (d, t) => { go.textContent = `Mengompres & menyusun ${d}/${t}…`; });
    const blob = new Blob([r.bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = ($("fname").value.trim() || "Project_DAC_A4") + ".pdf"; a.click();
    URL.revokeObjectURL(url);
    const saved = r.originalImageBytes > 0 ? Math.max(0, Math.round((1 - r.compressedImageBytes / r.originalImageBytes) * 100)) : 0;
    $("ok").textContent = r.originalImageBytes > 0
      ? `PDF ${formatBytes(blob.size)} — gambar ${formatBytes(r.originalImageBytes)} → ${formatBytes(r.compressedImageBytes)} (hemat ${saved}%).`
      : `PDF ${formatBytes(blob.size)} berhasil dibuat.`;
    $("ok").hidden = false;
    items = []; $("fname").value = ""; render();
  } catch (e) {
    $("err").textContent = e && e.message ? e.message : "Gagal memproses file.";
    $("err").hidden = false;
  } finally {
    go.textContent = "Proses & Download";
    go.disabled = items.length === 0;
  }
};
render();
</script>
</body>
</html>
